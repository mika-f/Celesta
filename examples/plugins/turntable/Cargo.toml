[package]
name = "celesta-plugin-turntable"
description = "A sample Celesta content plugin: a checkered cube turning on a turntable, drawn as a 3D scene from a process of its own."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "celesta-plugin-turntable"
path = "src/main.rs"

[dependencies]
celesta-plugin.workspace = true
serde_json.workspace = true

[dev-dependencies]
celesta-composition.workspace = true
celesta-gpu-renderer.workspace = true
celesta-plugin-host.workspace = true
tempfile = "3.23.0"
