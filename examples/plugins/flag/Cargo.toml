[package]
name = "celesta-plugin-flag"
description = "A sample Celesta content plugin: an image waving like a flag, drawn as meshes from a process of its own."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "celesta-plugin-flag"
path = "src/main.rs"

[dependencies]
celesta-plugin.workspace = true
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
serde_json.workspace = true

[dev-dependencies]
celesta-composition.workspace = true
celesta-gpu-renderer.workspace = true
celesta-plugin-host.workspace = true
tempfile = "3.23.0"
