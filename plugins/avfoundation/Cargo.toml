[package]
name = "celesta-codec-avfoundation"
description = "Celesta's macOS media plugin: VideoToolbox and AudioToolbox encoders, AVFoundation muxers and decoder, in a process of its own."
# Celesta's version, which plugin.json gives too; both are bumped with the
# root's by `node scripts/plugins/bump-version.mts`.
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mika-f/celesta"
rust-version = "1.89"

# It builds on every system, so the plugins workspace does, but serves
# media on macOS only: plugin.json's `os` has `build.mts` skip it elsewhere,
# and everything that reaches an Apple framework is behind
# `cfg(target_os = "macos")`.
[dependencies]
# Celesta's crates, pinned to Celesta's version for crates.io; the pins are
# bumped by `node scripts/plugins/bump-version.mts`.
celesta-composition = { path = "../../crates/composition", version = "=0.9.0" }
celesta-media = { path = "../../crates/media", version = "=0.9.0" }
celesta-plugin-host = { path = "../../crates/plugin-host", version = "=0.9.0" }
# plugin.json, read for the components the plugin declares.
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
# VideoToolbox's output handler is a block.
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
# `exception`: the muxers catch what AVAssetWriter raises rather than abort.
objc2 = { version = "0.6.5", default-features = false, features = ["std", "exception"] }
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = ["AudioCodec", "AudioConverter", "AudioFormat", "objc2-core-audio-types"] }
# AVAssetWriter, for the muxers; AVAssetReader, for the decoder.
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-media", "objc2-core-video", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVAssetWriter", "AVAssetWriterInput", "AVAsynchronousKeyValueLoading", "AVMediaFormat", "AVVideoSettings"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["alloc", "CFArray", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-core-audio-types", "objc2-core-video", "CMAttachment", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "CMTimeRange"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSString", "NSURL", "NSValue"] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["std", "objc2", "block2", "objc2-core-media", "objc2-core-video", "VTCompressionProperties", "VTCompressionSession", "VTErrors", "VTSession", "VTVideoEncoderList"] }

# The FFmpeg plugin decodes and muxes what the encoders give, in the tests.
[target.'cfg(target_os = "macos")'.dev-dependencies]
celesta-codec-ffmpeg = { path = "../ffmpeg", version = "=0.9.0" }
celesta-codec-ffmpeg-x264 = { path = "../ffmpeg-x264", version = "=0.9.0" }
# The exports that combine this plugin's components with the FFmpeg plugin's.
celesta-exporter = { path = "../../crates/exporter", version = "=0.9.0" }
celesta-gpu-renderer = { path = "../../crates/gpu-renderer", version = "=0.9.0" }
celesta-project = { path = "../../crates/project", version = "=0.9.0" }
# The FFmpeg plugin's bindings, for reading decoded frames' planes.
ffmpeg-sys-next = "8.1.0"
# The export tests' images.
png = "0.18.1"
tempfile = "3.23.0"
