[package]
name = "celesta-codec-ffmpeg"
description = "Celesta's FFmpeg codec plugin: probes, decodes, encodes, and muxes media for Celesta in a process of its own."
# Celesta's version, which plugin.json gives too; both are bumped with the
# root's by `node scripts/plugins/bump-version.mts`.
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mika-f/celesta"
rust-version = "1.89"

[dependencies]
# Celesta's crates, pinned to Celesta's version for crates.io; the pins are
# bumped by `node scripts/plugins/bump-version.mts`, here and below.
celesta-composition = { path = "../../crates/composition", version = "=0.9.0" }
celesta-media = { path = "../../crates/media", version = "=0.9.0" }
celesta-plugin-host = { path = "../../crates/plugin-host", version = "=0.9.0" }
ez-ffmpeg = "0.19"
# The same FFmpeg bindings ez-ffmpeg links, for reading decoded frames.
ffmpeg-sys-next = "8.1.0"
rayon = "1.12.0"
# plugin.json, read for the decoders and printed for `--manifest`.
serde_json = "1.0.154"

# macOS packages bundle Homebrew dylibs; retain static linking elsewhere.
[target.'cfg(not(target_os = "macos"))'.dependencies]
ez-ffmpeg = { version = "0.19", features = ["static"] }

[dev-dependencies]
celesta-exporter = { path = "../../crates/exporter", version = "=0.9.0" }
celesta-gpu-renderer = { path = "../../crates/gpu-renderer", version = "=0.9.0" }
celesta-project = { path = "../../crates/project", version = "=0.9.0" }
png = "0.18.1"
tempfile = "3.23.0"

# The codec bench's CPU times (examples/codec-bench.rs).
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"
