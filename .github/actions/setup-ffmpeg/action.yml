name: Set up FFmpeg 8.1
description: >
  Installs the FFmpeg 8.1.x development libraries Celesta links against:
  vcpkg ffmpeg[x264]:x64-windows-static-md on Windows (VCPKG_ROOT is exported),
  Homebrew ffmpeg@8 on macOS, and a source build by scripts/build-ffmpeg-linux.sh
  on Linux (PKG_CONFIG_PATH is exported on both).

runs:
  using: composite
  steps:
    # vcpkg and Homebrew master both ship FFmpeg 9, which Celesta does not
    # support yet, so Windows pins a vcpkg release whose ffmpeg port is 8.1.x.
    - name: Check out vcpkg
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VCPKG_TAG: '2026.07.29'
      run: |
        $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
        git clone --quiet --depth 1 --branch $env:VCPKG_TAG https://github.com/microsoft/vcpkg $root
        if ($LASTEXITCODE -ne 0) { throw 'git clone failed' }
        & "$root/bootstrap-vcpkg.bat" -disableMetrics
        if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
        "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
        # Building FFmpeg and x264 from source takes a long time; keep vcpkg's
        # binary packages in a cached directory.
        $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
        New-Item -ItemType Directory -Force $cache | Out-Null
        "VCPKG_BINARY_CACHE_DIR=$cache" >> $env:GITHUB_ENV
        "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
        "VCPKG_CACHE_KEY_PREFIX=vcpkg-$env:VCPKG_TAG-ffmpeg-x264-x64-windows-static-md-$env:ImageOS-" >> $env:GITHUB_ENV
        "VCPKG_CACHE_KEY_IMAGE=$env:ImageVersion" >> $env:GITHUB_ENV

    # The runner image version is part of the key so a new image (and with it a
    # possibly different MSVC, which changes vcpkg's ABI hashes) saves a fresh
    # entry, while restore-keys still reuses every package whose hash is unchanged.
    - name: Restore vcpkg binary cache
      id: vcpkg-cache
      if: runner.os == 'Windows'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.VCPKG_BINARY_CACHE_DIR }}
        key: ${{ env.VCPKG_CACHE_KEY_PREFIX }}${{ env.VCPKG_CACHE_KEY_IMAGE }}
        restore-keys: ${{ env.VCPKG_CACHE_KEY_PREFIX }}

    - name: Install FFmpeg (vcpkg)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & "$env:VCPKG_ROOT/vcpkg.exe" install 'ffmpeg[x264]:x64-windows-static-md' --clean-after-build
        if ($LASTEXITCODE -ne 0) { throw 'vcpkg install failed' }

    # Save right away so a later build or test failure does not discard FFmpeg.
    - name: Save vcpkg binary cache
      if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.VCPKG_BINARY_CACHE_DIR }}
        key: ${{ env.VCPKG_CACHE_KEY_PREFIX }}${{ env.VCPKG_CACHE_KEY_IMAGE }}

    - name: Install FFmpeg (Homebrew)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # The runner image's formula index can predate ffmpeg@8.
        brew update
        # ffmpeg@8 now depends on openssl@4, and pouring it in the same brew
        # process that is upgrading ca-certificates trips over the openssl@3
        # lock the process already holds. Install it on its own first.
        brew install openssl@4
        brew install ffmpeg@8 pkg-config
        # The versioned Cellar path ends up in cached build output, so expose the
        # version for the Rust cache key (rust-cache `env-vars`).
        echo "FFMPEG_VERSION=$(brew list --versions ffmpeg@8)" >> "$GITHUB_ENV"
        # ffmpeg@8 is keg-only.
        echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@8)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

    # Ubuntu's FFmpeg is 6.1, so Linux builds FFmpeg 8.1.x from source and
    # caches the installed libraries.
    - name: Install FFmpeg build dependencies (apt)
      if: runner.os == 'Linux'
      shell: bash
      env:
        FFMPEG_VERSION: '8.1.3'
      run: |
        sudo apt-get update
        # libclang-dev is for bindgen in ffmpeg-sys-next, not for FFmpeg itself.
        sudo apt-get install -y --no-install-recommends nasm zlib1g-dev libx264-dev libclang-dev
        # The prefix ends up in cached build output, so expose the version for
        # the Rust cache key (rust-cache `env-vars`).
        echo "FFMPEG_VERSION=$FFMPEG_VERSION" >> "$GITHUB_ENV"
        echo "FFMPEG_PREFIX=$RUNNER_TEMP/ffmpeg-$FFMPEG_VERSION" >> "$GITHUB_ENV"

    - name: Restore FFmpeg build cache
      id: ffmpeg-cache
      if: runner.os == 'Linux'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.FFMPEG_PREFIX }}
        key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ env.ImageOS }}-${{ hashFiles('scripts/build-ffmpeg-linux.sh') }}

    - name: Build FFmpeg
      if: runner.os == 'Linux' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
      shell: bash
      run: '"$GITHUB_WORKSPACE/scripts/build-ffmpeg-linux.sh" "$FFMPEG_PREFIX"'

    # Save right away so a later build or test failure does not discard FFmpeg.
    - name: Save FFmpeg build cache
      if: runner.os == 'Linux' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.FFMPEG_PREFIX }}
        key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ env.ImageOS }}-${{ hashFiles('scripts/build-ffmpeg-linux.sh') }}

    - name: Use FFmpeg
      if: runner.os == 'Linux'
      shell: bash
      run: echo "PKG_CONFIG_PATH=$FFMPEG_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
