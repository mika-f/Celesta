name: Set up FFmpeg 8.1
# Cargo features unify; use independent native installs and select one per binary.
description: Build standard, x264 (GPL), Opus and VPX FFmpeg variants in separate prefixes.
runs:
  using: composite
  steps:
    - name: Name FFmpeg builds
      shell: bash
      env:
        # Unix source builds track Renovate; Windows uses the pinned vcpkg port.
        FFMPEG_VERSION: '8.1.3'
      run: |
        if [[ "$RUNNER_OS" == Windows ]]; then version=8.1.2; else version="$FFMPEG_VERSION"; fi
        echo "FFMPEG_VERSION=$version" >> "$GITHUB_ENV"
        echo "FFMPEG_FEATURES=standard,x264,opus,vpx-v2" >> "$GITHUB_ENV"
        echo "FFMPEG_PREFIX=$RUNNER_TEMP/ffmpeg-variants" >> "$GITHUB_ENV"

    - name: Install macOS build dependencies
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
      run: brew install pkg-config nasm x264 libvpx opus

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends nasm zlib1g-dev libx264-dev libvpx-dev libopus-dev libclang-dev

    - name: Fingerprint the runner and codec dependencies
      shell: bash
      run: |
        echo "FFMPEG_IMAGE_OS=${ImageOS:-$RUNNER_OS}" >> "$GITHUB_ENV"
        echo "FFMPEG_IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"
        case "$RUNNER_OS" in
          macOS) dependencies="$(brew list --versions x264 libvpx opus)" ;;
          Linux) dependencies="$(dpkg-query -W libx264-dev libvpx-dev libopus-dev zlib1g-dev)" ;;
          Windows) dependencies=vcpkg-2026.07.29 ;;
        esac
        fingerprint="$(printf '%s' "$dependencies" | openssl dgst -sha256 | awk '{print $NF}')"
        echo "FFMPEG_DEPS_HASH=$fingerprint" >> "$GITHUB_ENV"

    - name: Restore native FFmpeg libraries
      id: cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.FFMPEG_PREFIX }}
        key: ffmpeg-variants-${{ runner.os }}-${{ runner.arch }}-${{ env.FFMPEG_IMAGE_OS }}-${{ env.FFMPEG_IMAGE_VERSION }}-${{ env.FFMPEG_DEPS_HASH }}-${{ env.FFMPEG_VERSION }}-vcpkg-2026.07.29-${{ hashFiles('scripts/build-ffmpeg-linux.sh', '.github/actions/setup-ffmpeg/action.yml') }}

    - name: Build Unix FFmpeg libraries
      if: runner.os != 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == macOS ]]; then
          export PKG_CONFIG_PATH="$(brew --prefix x264)/lib/pkgconfig:$(brew --prefix libvpx)/lib/pkgconfig:$(brew --prefix opus)/lib/pkgconfig"
        fi
        for variant in standard x264 opus vpx; do
          FFMPEG_VARIANT="$variant" scripts/build-ffmpeg-linux.sh "$FFMPEG_PREFIX/$variant"
        done

    - name: Build Windows FFmpeg libraries
      if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg-build'
        git clone --quiet --depth 1 --branch 2026.07.29 https://github.com/microsoft/vcpkg $vcpkg
        if ($LASTEXITCODE -ne 0) { throw 'vcpkg clone failed' }
        & "$vcpkg/bootstrap-vcpkg.bat" -disableMetrics
        if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
        foreach ($variant in @('standard', 'x264', 'opus', 'vpx')) {
          $root = Join-Path $env:FFMPEG_PREFIX $variant
          $features = if ($variant -eq 'standard') { 'zlib' } else { $variant }
          & "$vcpkg/vcpkg.exe" install --clean-after-build "--x-install-root=$root/installed" "ffmpeg[$features]:x64-windows-static-md-release"
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg $variant build failed" }
          New-Item -ItemType File -Force (Join-Path $root '.vcpkg-root') | Out-Null
        }

    - name: Save native FFmpeg libraries
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ env.FFMPEG_PREFIX }}
        key: ffmpeg-variants-${{ runner.os }}-${{ runner.arch }}-${{ env.FFMPEG_IMAGE_OS }}-${{ env.FFMPEG_IMAGE_VERSION }}-${{ env.FFMPEG_DEPS_HASH }}-${{ env.FFMPEG_VERSION }}-vcpkg-2026.07.29-${{ hashFiles('scripts/build-ffmpeg-linux.sh', '.github/actions/setup-ffmpeg/action.yml') }}

    - name: Select Unix FFmpeg libraries
      if: runner.os != 'Windows'
      shell: bash
      run: |
        echo "PKG_CONFIG_PATH=$FFMPEG_PREFIX/standard/lib/pkgconfig" >> "$GITHUB_ENV"
        for variant in x264 opus vpx; do
          echo "FFMPEG_$(echo "$variant" | tr '[:lower:]' '[:upper:]')_PKG_CONFIG_PATH=$FFMPEG_PREFIX/$variant/lib/pkgconfig" >> "$GITHUB_ENV"
        done

    - name: Select Windows FFmpeg libraries
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "VCPKG_ROOT=$env:FFMPEG_PREFIX/standard" >> $env:GITHUB_ENV
        "VCPKGRS_TRIPLET=x64-windows-static-md-release" >> $env:GITHUB_ENV
        foreach ($variant in @('x264', 'opus', 'vpx')) {
          "FFMPEG_$($variant.ToUpper())_VCPKG_ROOT=$env:FFMPEG_PREFIX/$variant" >> $env:GITHUB_ENV
        }
