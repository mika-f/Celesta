name: Performance

# Compares the GPU renderer's work per frame between a pull request and its
# base. Hosted runners have no GPU, and wall-clock time on shared runners is
# too noisy to compare, so the renderer runs on Mesa's software Vulkan driver
# (lavapipe) under Valgrind's Cachegrind, which counts the instructions of
# the measured frames: the renderer's CPU work and, through lavapipe, its
# shader work. A second job times the same workloads on a macOS runner's GPU
# as a reference. perf-comment.yml then posts both on the pull request.
# See docs/performance/benchmarking.md.
#
# A pull request is measured only while it has the `perf` label: adding the
# label measures the current head, and each later push measures again. The
# jobs hold runners for 15 to 25 minutes, and the macOS one takes one of the
# few macOS runners the CI tests wait for, so they do not run on every pull
# request.
#
# Like ci.yml, pull requests only restore the Rust cache: a cache saved from
# a pull request's ref is visible to that pull request alone, and these are
# large enough to evict main's. On a push to main the instructions job only
# builds the head, to save the cache that pull requests restore.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/bench.py"
      - ".github/actions/setup-ffmpeg/**"
      - ".github/workflows/perf.yml"
  pull_request:
    types: [labeled, synchronize, reopened]
    paths:
      # Rust crate changes can affect the benchmark or its build.
      - "crates/**"
      # These packages are bundled into the React runtime used by the scenes.
      - "packages/character/src/**"
      - "packages/cli/src/**"
      - "packages/code/src/**"
      - "packages/components/src/**"
      - "packages/layout/src/**"
      - "packages/math/src/**"
      - "packages/media-utils/src/**"
      - "packages/react/src/**"
      - "packages/shapes/src/**"
      - "packages/text/src/**"
      - "packages/transitions/src/**"
      # Keep the measured scenes and their referenced images and fonts in sync.
      - "examples/spectra/**/*.tsx"
      - "examples/spectra/**/*.ts"
      - "examples/versus/bench/celesta/**/*.tsx"
      - "examples/versus/bench/assets/fonts/**"
      - "examples/assets/dialogue-demo/portraits/**"
      # The comparison itself.
      - "scripts/bench.py"
      - ".github/workflows/perf.yml"
  workflow_dispatch:
    inputs:
      base:
        description: Base revision to compare the selected branch with
        required: true
        default: origin/main

permissions:
  contents: read

concurrency:
  # Adding another label starts a run whose jobs all skip; its own group keeps
  # it from cancelling a measurement in progress.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'perf' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # mise installs only Node.js and pnpm; see ci.yml.
  MISE_DISABLE_TOOLS: rust,mr-boxington

jobs:
  instructions:
    name: Instructions per frame (lavapipe)
    # A push to main builds for the cache; a pull request needs the label.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'perf') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'perf'))
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The base revision is built from a worktree of this checkout.
          fetch-depth: 0

      # Valgrind 3.22 or later for Cachegrind's instrumentation client
      # requests, lavapipe, and CJK fonts for the text workloads.
      - name: Install Linux dependencies
        if: github.event_name != 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind mesa-vulkan-drivers fonts-noto-cjk

      - uses: $/.github/actions/setup-ffmpeg

      # rust-cache hashes every installed toolchain; exclude the runner's moving stable.
      - name: Isolate Rust toolchain
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/celesta-rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: perf
          env-vars: FFMPEG_VERSION FFMPEG_FEATURES
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Node.js and pnpm as mise.lock pins them.
      - uses: jdx/mise-action@v5.2.4
        with:
          version: 2026.10.25
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      # rust-cache keys on the job, so the cache is saved from this job, with
      # the build compare does for the head.
      - name: Build for the cache
        if: github.event_name == 'push'
        run: python3 scripts/bench.py build

      # Builds celesta-bench and the React runtime at both revisions, then
      # fails if a workload needs more than 1% more instructions per frame.
      # The base's worktree stays out of target/, which rust-cache saves.
      - name: Compare with the base
        if: github.event_name != 'push'
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: |
          mkdir -p perf
          python3 scripts/bench.py compare --mode instructions --base "$BASE" \
            --worktrees "$RUNNER_TEMP/bench-worktrees" \
            --markdown perf/report.md --csv perf/observations.csv --fail-on-regression

      - name: Write the job summary
        if: always()
        run: if [ -f perf/report.md ]; then cat perf/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      # perf-comment.yml posts the report on the pull request. It runs in the
      # base repository's context, since this job's token cannot write to
      # pull requests from forks.
      - name: Record the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: mkdir -p perf && echo "$PR_NUMBER" > perf/pr-number

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: perf-report
          path: perf/
          if-no-files-found: ignore
          retention-days: 30

  # Time per frame on a GPU (Apple silicon, Metal), which the instruction
  # counts above cannot tell. Wall-clock time on a shared runner is noisy, so
  # this is a reference, not a check: it never fails the workflow
  # (continue-on-error), perf-comment.yml adds its table below the
  # instruction counts, and the report names the adapter; a software one means
  # the runner has no usable GPU.
  time:
    name: Time per frame (macOS)
    # As `instructions`, but not on a push to main: nothing to time there.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'perf') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'perf'))
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: $/.github/actions/setup-ffmpeg

      - name: Isolate Rust toolchain
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/celesta-rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: perf-macos
          env-vars: FFMPEG_VERSION FFMPEG_FEATURES
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Never on main, so it only restores the cache ci.yml saves there.
      - uses: jdx/mise-action@v5.2.4
        with:
          version: 2026.10.25
          cache_save: false

      - name: Compare with the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: |
          mkdir -p perf
          python3 scripts/bench.py compare --mode time --base "$BASE" \
            --worktrees "$RUNNER_TEMP/bench-worktrees" \
            --markdown perf/report-time.md --csv perf/observations-time.csv

      - name: Write the job summary
        if: always()
        run: if [ -f perf/report-time.md ]; then cat perf/report-time.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: perf-report-time
          path: perf/
          if-no-files-found: ignore
          retention-days: 30
