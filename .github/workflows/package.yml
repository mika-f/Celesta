name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (x.y.z)
        required: true

permissions:
  contents: read
  # package-build.yml's setup-ffmpeg downloads Windows' FFmpeg from GitHub Packages.
  packages: read

env:
  CARGO_TERM_COLOR: always
  # mise installs only Node.js and pnpm; see ci.yml.
  MISE_DISABLE_TOOLS: rust,mr-boxington
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check release tag format
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $RELEASE_TAG (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release tag matches the workspace version
        id: version
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release $RELEASE_TAG does not match the workspace version $version in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: validate
    uses: ./.github/workflows/package-build.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      release: true
    secrets: inherit

  release:
    name: Create release
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --title "Celesta ${RELEASE_TAG#v}"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes \
              --title "Celesta ${RELEASE_TAG#v}"
          fi

  deploy-website:
    name: Deploy website
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # No rust-cache: no other run saves this job's key, so it never restored
      # anything, and the codegen it would cache takes under half a minute,
      # while every release saved another entry only that tag could restore.

      # Node.js and pnpm as mise.lock pins them. A tag's run restores main's
      # cache; one it saved would be visible to that tag alone.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          cache_save: false

      - run: pnpm install --frozen-lockfile

      # @celesta/web imports Rust-generated types from @celesta/react.
      # Each job has a fresh checkout, so generate them before building the website.
      - name: Generate TypeScript bindings
        run: pnpm --dir packages/react run codegen --locked

      # Points the download buttons at the assets attached to this release.
      - name: Resolve download URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          urls="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets')"
          find_url() { jq -er --arg re "$1" '[.[] | select(.name | test($re)) | .browserDownloadUrl // .url][0]' <<< "$urls"; }
          {
            echo "CELESTA_DOWNLOAD_URL=https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
            echo "CELESTA_DOWNLOAD_URL_MACOS=$(find_url '-macos-arm64\.dmg$')"
            echo "CELESTA_DOWNLOAD_URL_WINDOWS=$(find_url '-windows-x64-setup\.exe$')"
          } >> "$GITHUB_ENV"

      # `pnpm deploy` is a built-in command, so the script needs `run`.
      - name: Deploy to Cloudflare Workers
        working-directory: packages/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy
