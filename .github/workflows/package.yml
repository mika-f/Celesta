name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (x.y.z)
        required: true

permissions:
  contents: read
  # package-build.yml's setup-ffmpeg downloads Windows' FFmpeg from GitHub Packages.
  packages: read

env:
  CARGO_TERM_COLOR: always
  # mise installs only Node.js and pnpm; see ci.yml.
  MISE_DISABLE_TOOLS: rust,mr-boxington
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check release tag format
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $RELEASE_TAG (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - name: Check release tag matches the workspace version
        id: version
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release $RELEASE_TAG does not match the workspace version $version in Cargo.toml" >&2
            exit 1
          fi
          for plugin in ffmpeg ffmpeg-x264 avfoundation mediafoundation; do
            plugin_version="$(node -p "require('./plugins/$plugin/plugin.json').version")"
            if [[ "$plugin_version" != "$version" ]]; then
              echo "plugins/$plugin/plugin.json gives $plugin_version, not the workspace version $version; run node scripts/plugins/bump-version.mts" >&2
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: validate
    uses: ./.github/workflows/package-build.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      release: true
    secrets: inherit

  release:
    name: Create release
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --title "Celesta ${RELEASE_TAG#v}"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes \
              --title "Celesta ${RELEASE_TAG#v}"
          fi

  # crates.io trusts this workflow (package.yml) in the crates-io environment
  # for each crate (Trusted Publishing), so no API token is stored: the auth
  # action exchanges the job's OIDC token for a crates.io token that lasts 30
  # minutes and is revoked when the job ends. The token is fetched only after
  # `cargo package` has verified every crate, since verifying takes longer
  # than the token lasts; publishing then skips verification. See
  # docs/handoff/2026-11-14-crates-io-trusted-publishing.md.
  crates:
    name: Publish crates
    needs: [release]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1

      # The verification builds compile the editor too.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libxkbcommon-x11-dev libfontconfig-dev

      # A rerun publishes only what an earlier attempt left.
      - name: List unpublished crates
        id: crates
        run: |
          crates="$(scripts/unpublished-crates.sh Cargo.toml | tr '\n' ' ')"
          echo "Unpublished: ${crates:-none}"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"

      # celesta-mcp and celesta-editor package copies of repository files.
      - name: Bundle crate files
        if: steps.crates.outputs.crates != ''
        run: node scripts/bundle-crate-files.mjs

      # Builds each crate from its package, against the others' packages, so
      # nothing reaches crates.io unless all of them build. `--allow-dirty`
      # is for the bundled copies; the publish below packages again.
      - name: Verify packages
        if: steps.crates.outputs.crates != ''
        env:
          CRATES: ${{ steps.crates.outputs.crates }}
        run: |
          args=()
          for crate in $CRATES; do args+=(-p "$crate"); done
          cargo package --locked --allow-dirty "${args[@]}"

      - name: Authenticate with crates.io
        if: steps.crates.outputs.crates != ''
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6

      # Cargo publishes in dependency order and waits for each crate to reach
      # the index. The two crates with bundled copies go last, with
      # `--allow-dirty`, so the others record a clean checkout.
      - name: Publish
        if: steps.crates.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.crates.outputs.crates }}
        run: |
          clean=()
          bundled=()
          for crate in $CRATES; do
            case "$crate" in
              celesta-editor | celesta-mcp) bundled+=(-p "$crate") ;;
              *) clean+=(-p "$crate") ;;
            esac
          done
          if (( ${#clean[@]} )); then
            cargo publish --locked --no-verify "${clean[@]}"
          fi
          if (( ${#bundled[@]} )); then
            cargo publish --locked --no-verify --allow-dirty "${bundled[@]}"
          fi

  # The media plugins' crates, from the plugins workspace. Their pins on the
  # core crates resolve from crates.io, so they follow the crates job.
  plugin-crates:
    name: Publish plugin crates
    needs: [crates]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1

      - name: List unpublished crates
        id: crates
        run: |
          crates="$(scripts/unpublished-crates.sh plugins/Cargo.toml | tr '\n' ' ')"
          echo "Unpublished: ${crates:-none}"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"

      # The FFmpeg plugins' verification builds link the standard FFmpeg
      # build (PKG_CONFIG_PATH). The x264 plugin's links it too: libx264 is
      # found when its program runs, not when it links. AVFoundation and
      # Media Foundation build their stub programs here.
      - if: steps.crates.outputs.crates != ''
        uses: $/.github/actions/setup-ffmpeg

      - name: Verify packages
        if: steps.crates.outputs.crates != ''
        env:
          CRATES: ${{ steps.crates.outputs.crates }}
        run: |
          args=()
          for crate in $CRATES; do args+=(-p "$crate"); done
          cargo package --manifest-path plugins/Cargo.toml --locked "${args[@]}"

      - name: Authenticate with crates.io
        if: steps.crates.outputs.crates != ''
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6

      - name: Publish
        if: steps.crates.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.crates.outputs.crates }}
        run: |
          args=()
          for crate in $CRATES; do args+=(-p "$crate"); done
          cargo publish --manifest-path plugins/Cargo.toml --locked --no-verify "${args[@]}"

  deploy-website:
    name: Deploy website
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      # No rust-cache: no other run saves this job's key, so it never restored
      # anything, and the codegen it would cache takes under half a minute,
      # while every release saved another entry only that tag could restore.

      # Node.js and pnpm as mise.lock pins them. A tag's run restores main's
      # cache; one it saved would be visible to that tag alone.
      - uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.11.4
          cache_save: false

      - run: pnpm install --frozen-lockfile

      # @celesta.studio/web imports Rust-generated types from @celesta.studio/react.
      # Each job has a fresh checkout, so generate them before building the website.
      - name: Generate TypeScript bindings
        run: pnpm --dir packages/react run codegen --locked

      # Points the download buttons at the assets attached to this release.
      - name: Resolve download URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          urls="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets')"
          find_url() { jq -er --arg re "$1" '[.[] | select(.name | test($re)) | .browserDownloadUrl // .url][0]' <<< "$urls"; }
          {
            echo "CELESTA_DOWNLOAD_URL=https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
            echo "CELESTA_DOWNLOAD_URL_MACOS=$(find_url '-macos-arm64\.dmg$')"
            echo "CELESTA_DOWNLOAD_URL_WINDOWS=$(find_url '-windows-x64-setup\.exe$')"
          } >> "$GITHUB_ENV"

      # `pnpm deploy` is a built-in command, so the script needs `run`.
      - name: Deploy to Cloudflare Workers
        working-directory: packages/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy
