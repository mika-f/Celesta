name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep limited debug information while reducing compilation and cache size.
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-latest
          - name: Linux x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash -e stops at the first failing command; Windows pwsh steps would not.
        shell: bash
    # The first Windows run builds FFmpeg and x264 with vcpkg before the cache exists.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GPUI's keyboard, font, and audio libraries, and Mesa's software Vulkan
      # driver (lavapipe) so the GPU renderer tests run without a GPU.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libxkbcommon-x11-dev libfontconfig-dev mesa-vulkan-drivers

      - uses: ./.github/actions/setup-ffmpeg

      # rust-cache hashes every installed toolchain; exclude the runner's moving stable.
      - name: Isolate Rust toolchain
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/celesta-rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          # Update deliberately so compiler releases do not unexpectedly invalidate caches.
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: FFMPEG_VERSION

      # The pnpm version comes from package.json's `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # celesta-react-bridge and celesta-exporter tests spawn the compiled
      # packages/react/dist/cli.js, so build the React package first.
      - name: Build @celesta/react
        run: |
          pnpm --dir packages/react install --frozen-lockfile
          pnpm --dir packages/react run codegen --locked --timings
          pnpm --dir packages/react run build

      - name: Test @celesta/react
        run: pnpm --dir packages/react run test

      - name: Test @celesta/code
        run: |
          pnpm --dir packages/code run test
          pnpm --dir packages/code run check:examples

      - name: Test @celesta/math
        run: pnpm --dir packages/math run test

      - name: Build
        # Compile normal binaries and test targets together so Cargo can schedule
        # them in parallel; the Test step reuses the compiled test targets.
        run: cargo build --workspace --all-targets --locked --timings

      # Linux has lavapipe; missing it must fail rather than skip GPU tests.
      - name: Test
        env:
          CELESTA_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: cargo test --workspace --locked --no-fail-fast --timings

      - name: Upload Cargo build timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-${{ runner.os }}-${{ runner.arch }}
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 14
