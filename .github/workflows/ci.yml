name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # setup-ffmpeg downloads Windows' FFmpeg from GitHub Packages.
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep limited debug information while reducing compilation and cache size.
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and macOS build only what the tests run; Linux also
          # compiles the examples and the normal binaries no test spawns.
          - name: Windows x64
            os: windows-latest
            cargo-targets: --tests
          - name: macOS arm64
            os: macos-latest
            cargo-targets: --tests
          - name: Linux x64
            os: ubuntu-latest
            cargo-targets: --all-targets
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash -e stops at the first failing command; Windows pwsh steps would not.
        shell: bash
    # The first Windows run builds FFmpeg and its encoders with vcpkg before the cache exists.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GPUI's keyboard, font, and audio libraries, and Mesa's software Vulkan
      # driver (lavapipe) so the GPU renderer tests run without a GPU.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libxkbcommon-x11-dev libfontconfig-dev mesa-vulkan-drivers

      # Installing FFmpeg takes about two minutes on macOS (Homebrew), so the
      # Rust toolchain, Node.js, and the JS packages install meanwhile.
      # rust-cache waits for it: FFMPEG_VERSION is part of its key, and a
      # background step's environment reaches later steps only after `wait`.
      # It starts after the Linux packages, as both use apt.
      - id: ffmpeg
        uses: ./.github/actions/setup-ffmpeg
        background: true

      # rust-cache hashes every installed toolchain; exclude the runner's moving stable.
      - name: Isolate Rust toolchain
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/celesta-rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          # Update deliberately so compiler releases do not unexpectedly invalidate caches.
          toolchain: 1.99.0

      # The pnpm version comes from package.json's `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No pnpm store cache: an install without one takes under 20 seconds,
      # less than restoring and saving the store, and a pull request that
      # changes the lockfile would save its own store on every OS.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install JS packages
        run: pnpm install --frozen-lockfile

      - wait: ffmpeg

      # Pull requests restore main's cache; saving their own copies only
      # crowds main's entries out of the repository's cache quota.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: FFMPEG_VERSION FFMPEG_FEATURES
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # After rust-cache, which restores ~/.cargo/bin, where it installs.
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest@0.9.146

      # celesta-react-bridge and celesta-exporter tests spawn the compiled
      # packages/cli/dist/cli.js, so build the CLI and every package it serves first.
      - name: Build Celesta packages
        run: |
          pnpm --dir packages/react run codegen --locked --timings
          pnpm run build:runtime

      # Not beside the Rust build: many of these tests keep vitest's 5 second
      # timeout and spawn processes, which time out on a runner whose cores
      # Cargo keeps busy.
      - name: Test Celesta packages
        run: |
          pnpm run test:runtime
          pnpm --dir templates test
          pnpm --dir packages/website test

      # Type checks have no timeouts, so they run beside the Rust build and
      # use the cores it leaves idle while it links.
      - id: typecheck
        name: Typecheck templates and examples
        background: true
        run: |
          pnpm --dir templates typecheck
          pnpm --dir packages/code run check:examples
          pnpm run typecheck:examples

      - name: Build
        # Compile everything the Test step needs here so Cargo can schedule it in
        # parallel and --timings covers it; the Test step reuses the result.
        # `--tests` still builds the binaries the integration tests spawn
        # (CARGO_BIN_EXE_*) but skips the examples, which `cargo test` and
        # nextest would otherwise build.
        run: cargo build --workspace ${{ matrix.cargo-targets }} --locked --timings

      # A failed type check fails the job here, before the Rust tests start.
      - wait: typecheck

      # nextest runs every test in its own process, all binaries at once. The
      # GPU tests take turns within one process (see GPU_LOCK in
      # crates/gpu-renderer/src/tests.rs), so under `cargo test` they ran one by
      # one. nextest skips doctests; the workspace has none.
      # Linux has lavapipe; missing it must fail rather than skip GPU tests.
      # `--tests` runs the same tests as the default but does not build the
      # examples; `--all-targets` would also build and run them as tests.
      - name: Test
        env:
          CELESTA_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: cargo nextest run --workspace --tests --locked --no-fail-fast

      - name: Upload Cargo build timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-${{ runner.os }}-${{ runner.arch }}
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 14

  # Packages for Windows and macOS without signing them, so packaging breaks
  # here rather than at release time, and saves the release-profile Rust cache
  # on main for the next release tag to restore.
  package:
    name: Package
    if: github.event_name == 'push'
    uses: ./.github/workflows/package-build.yml
