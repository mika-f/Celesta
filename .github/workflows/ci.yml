name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash -e stops at the first failing command; Windows pwsh steps would not.
        shell: bash
    # The first Windows run builds FFmpeg and x264 with vcpkg before the cache exists.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-ffmpeg

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/react/pnpm-lock.yaml

      # celesta-react-bridge and celesta-exporter tests spawn the compiled
      # packages/react/dist/cli.js, so build the React package first.
      - name: Build @celesta/react
        run: |
          pnpm --dir packages/react install --frozen-lockfile
          pnpm --dir packages/react run codegen
          pnpm --dir packages/react run build

      - name: Test @celesta/react
        run: pnpm --dir packages/react run test

      - name: Build
        run: cargo build --workspace --locked

      # Tests that need a GPU adapter skip themselves when none is available.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
