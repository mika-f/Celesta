name: Package

# Builds the app packages and the optional ffmpeg-x264 download for each
# system. package.yml calls it to sign and publish a release; ci.yml calls
# it with nothing signed on every push to main, which checks packaging and saves the release-profile Rust cache on
# main, and on a manual run of CI, which checks a branch's packaging. A tag's
# run can restore caches from main but cannot share its own with the next
# tag, so without that a release compiles everything from scratch.

on:
  workflow_call:
    inputs:
      version:
        description: Package version (x.y.z)
        type: string
        default: 0.0.0
      release:
        description: Sign and notarize the packages and upload them as artifacts
        type: boolean
        default: false

permissions:
  contents: read
  # setup-ffmpeg downloads Windows' FFmpeg from GitHub Packages.
  packages: read

env:
  CARGO_TERM_COLOR: always
  # mise installs only Node.js and pnpm; see ci.yml.
  MISE_DISABLE_TOOLS: rust,mr-boxington

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    # The first run builds FFmpeg and its encoders with vcpkg before the cache exists.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup-ffmpeg

      # rust-cache hashes every installed toolchain; exclude the runner's moving stable.
      - name: Isolate Rust toolchain
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/celesta-rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@v1
        with:
          # The compiler CI tests with; a moving stable would also invalidate the cache.
          toolchain: 1.99.1

      # Only main's cache is visible to the next release tag. The codec
      # plugin builds in the plugins workspace, into plugins/target.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            . -> target
            plugins -> target
          env-vars: FFMPEG_VERSION FFMPEG_FEATURES FFMPEG_IMAGE_OS FFMPEG_IMAGE_VERSION FFMPEG_DEPS_HASH
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Node.js and pnpm as mise.lock pins them.
      - uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.11.4
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache bundled Node.js runtime
        uses: actions/cache@v6.1.0
        with:
          path: target/package-downloads
          key: windows-node-runtime-v26.13.0

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}/Inno Setup*/ISCC.exe", "$env:ProgramFiles/Inno Setup*/ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe was not found' }
          "ISCC_PATH=$($iscc.FullName)" >> $env:GITHUB_ENV

      - name: Build package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          RELEASE: ${{ inputs.release }}
        run: |
          pwsh -File scripts/package-windows.ps1 -Version $env:VERSION -IsccPath $env:ISCC_PATH
          if ($LASTEXITCODE -ne 0) { throw 'App packaging failed' }
          $arguments = @('scripts/package-media-plugins.py')
          if ($env:RELEASE -eq 'true') { $arguments += @('--version', $env:VERSION) }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Optional plugin packaging failed' }

      - if: inputs.release
        uses: actions/upload-artifact@v7.0.2
        with:
          name: celesta-windows-x64
          path: |
            target/packages/Celesta-${{ inputs.version }}-windows-x64.zip
            target/packages/Celesta-${{ inputs.version }}-windows-x64-setup.exe
          if-no-files-found: error

      - if: inputs.release
        uses: actions/upload-artifact@v7.0.2
        with:
          name: celesta-codecs-windows-x64
          path: target/packages/Celesta-plugin-ffmpeg-x264-*-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup-ffmpeg

      - name: Install dylibbundler
        run: brew install dylibbundler

      - name: Isolate Rust toolchain
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/celesta-rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            . -> target
            plugins -> target
          env-vars: FFMPEG_VERSION FFMPEG_FEATURES FFMPEG_IMAGE_OS FFMPEG_IMAGE_VERSION FFMPEG_DEPS_HASH
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.11.4
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      # A throwaway keychain, made the default so codesign finds the Developer
      # ID identity and notarytool finds the profile stored in it.
      - name: Set up signing and notarization
        if: inputs.release
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"

          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null

          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials celesta-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --keychain "$keychain"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # A release signs with the Developer ID (hardened runtime), notarizes and
      # staples both the app and the DMG; otherwise the app is signed ad hoc.
      - name: Build package
        env:
          VERSION: ${{ inputs.version }}
          RELEASE: ${{ inputs.release }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          signing=()
          if [[ "$RELEASE" == "true" ]]; then
            signing=(--sign-identity "$SIGN_IDENTITY" --notary-profile celesta-notary)
          fi
          python3 scripts/package-macos.py --version "$VERSION" "${signing[@]}"
          optional=()
          if [[ "$RELEASE" == "true" ]]; then optional=(--version "$VERSION"); fi
          python3 scripts/package-media-plugins.py "${optional[@]}" "${signing[@]}"

      - name: Remove signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true

      - if: inputs.release
        uses: actions/upload-artifact@v7.0.2
        with:
          name: celesta-macos-${{ matrix.arch }}
          path: target/packages/Celesta-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - if: inputs.release
        uses: actions/upload-artifact@v7.0.2
        with:
          name: celesta-codecs-macos-${{ matrix.arch }}
          path: target/packages/Celesta-plugin-ffmpeg-x264-*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  linux-plugins:
    name: Linux x64 x264 download
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-ffmpeg
      - name: Install ELF packaging tools
        run: sudo apt-get install -y --no-install-recommends patchelf
      - name: Isolate Rust toolchain
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/celesta-rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: plugins -> target
          env-vars: FFMPEG_VERSION FFMPEG_FEATURES FFMPEG_IMAGE_OS FFMPEG_IMAGE_VERSION FFMPEG_DEPS_HASH
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.11.4
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the optional x264 archive
        env:
          VERSION: ${{ inputs.version }}
          RELEASE: ${{ inputs.release }}
        run: |
          optional=()
          if [[ "$RELEASE" == "true" ]]; then optional=(--version "$VERSION"); fi
          python3 scripts/package-media-plugins.py "${optional[@]}"
      - if: inputs.release
        uses: actions/upload-artifact@v7.0.2
        with:
          name: celesta-codecs-linux-x64
          path: target/packages/Celesta-plugin-ffmpeg-x264-*-linux-x64.zip
          if-no-files-found: error
