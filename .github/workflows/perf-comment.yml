name: Performance comment

# Posts perf.yml's report on the pull request it measured, as one comment
# that later runs update. perf.yml runs the pull request's code with a token
# that cannot write to pull requests from forks; this workflow runs from the
# default branch with a token that can, and never checks out or runs the
# pull request's code. It reads the report and the pull request number from
# perf.yml's artifact as untrusted data: the number is used only if that
# pull request's head is the commit that was measured.

on:
  workflow_run:
    workflows: [Performance]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    name: Comment on the pull request
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: perf-report
          path: perf
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The macOS job is a reference and can be missing (it failed, was
      # cancelled, or the artifact expired); the comment is posted without it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: perf-report-time
          path: perf-time
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          pr="$(head -c 16 perf/pr-number 2>/dev/null | tr -d '[:space:]')"
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo "No pull request number in the artifact; nothing to do."
            exit 0
          fi
          # A newer push gets its own run and comment; skip a stale one.
          if [[ "$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)" != "$HEAD_SHA" ]]; then
            echo "Pull request #$pr has moved past $HEAD_SHA; not commenting."
            exit 0
          fi

          marker='<!-- celesta-bench -->'
          {
            echo "$marker"
            echo "## Performance"
            echo
            if [[ -f perf/report.md ]]; then
              # The verdict comes from the report itself: the run can also
              # fail after a report without regressions was written.
              if grep -q 'only the head was measured' perf/report.md; then
                echo "The base has no benchmark yet, so nothing was compared. The head's numbers are below."
              elif grep -q '🔴' perf/report.md; then
                echo "**A workload needs more than 1% more instructions per frame than the base (🔴 below).** If this is intended, say so in the pull request."
              elif [[ "$CONCLUSION" == success ]]; then
                echo "No workload needs more than 1% more instructions per frame than the base."
              else
                echo "No workload needs more than 1% more instructions per frame than the base, but the workflow failed afterwards. See the workflow run."
              fi
              echo
              # Drop the report's own heading; this comment has one.
              sed '1{/^###/d;}' perf/report.md
            else
              echo "The measurement did not finish. See the workflow run."
            fi
            if [[ -f perf-time/report-time.md ]]; then
              echo
              echo "<details><summary>Time per frame on a GPU (macOS runner, reference only)</summary>"
              echo
              echo "A shared VM: noisy, and never a check. Instruction counts above are what gates; a change that matters here should be confirmed on your own GPU."
              echo
              sed '1{/^###/d;}' perf-time/report-time.md
              echo
              echo "</details>"
            fi
            echo
            echo "<sub>Commit ${HEAD_SHA:0:7} · [workflow run]($RUN_URL) · [how this is measured](https://github.com/$REPO/blob/main/docs/performance/benchmarking.md)</sub>"
          } > body.md

          id="$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)"
          if [[ -n "$id" ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
            echo "Updated comment $id on #$pr."
          else
            gh api --method POST "repos/$REPO/issues/$pr/comments" -F body=@body.md > /dev/null
            echo "Commented on #$pr."
          fi
