[package]
name = "celesta-registry-format"
description = "The plugin registry's client-facing file formats: JSON Schemas, fixtures, and their Rust types."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22.1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
semver = { version = "1.0.28", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time = { version = "0.3.55", features = ["serde-well-known", "parsing", "formatting"] }

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }
serde_json.workspace = true
