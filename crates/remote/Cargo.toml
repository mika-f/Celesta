[package]
name = "celesta-remote"
description = "Downloads http and https assets into a per-user disk cache so Celesta reads them as local files."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
celesta-composition.workspace = true
data-url = "0.3.2"
fnv = "1.0.7"
percent-encoding = "2.3.2"
tempfile = "3.23.0"
thiserror.workspace = true
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2.5.8"
