[package]
name = "celesta-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# `gpui-kit` re-exports GPUI (as `gpui_kit::*`) from `gpui-pre` 0.3.x — a newer zed
# snapshot than the former `gpui 0.2.2` pin. `windows-manifest` is a default feature of
# `gpui-pre`, so the Common-Controls v6 app manifest (without which gpui's
# `TaskDialogIndirect` import fails to bind against comctl32 v5.82 and the editor exits at
# startup with STATUS_ENTRYPOINT_NOT_FOUND, 0xc0000139) stays embedded without re-listing.
gpui-kit = "0.6"
image = { version = "0.25.8", default-features = false }
celesta-composition = { path = "../composition" }
celesta-editor-core = { path = "../editor-core" }
celesta-editor-theme = { path = "../editor-theme" }
celesta-evaluator = { path = "../evaluator" }
celesta-exporter = { path = "../exporter" }
celesta-gpu-renderer = { path = "../gpu-renderer", features = ["clap"] }
celesta-media = { path = "../media" }
celesta-remote = { path = "../remote" }
celesta-project = { path = "../project" }
celesta-react-bridge = { path = "../react-bridge" }
celesta-source-edit = { path = "../source-edit" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap.workspace = true
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde_json.workspace = true
shlex = "1"
unicode-segmentation = "1.13.3"
anyhow.workspace = true
thiserror.workspace = true
