[package]
name = "mikan-editor"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# `default-features = false` drops gpui's default `windows-manifest`, so it must be
# re-listed: it embeds the app manifest that pulls in Common-Controls v6, without which
# gpui's `TaskDialogIndirect` import fails to bind against the system comctl32 v5.82 and
# the editor exits at startup with STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139).
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders", "windows-manifest"] }
image = { version = "0.25.8", default-features = false }
mikan-composition = { path = "../composition" }
mikan-evaluator = { path = "../evaluator" }
mikan-exporter = { path = "../exporter" }
mikan-gpu-renderer = { path = "../gpu-renderer" }
mikan-media = { path = "../media" }
mikan-project = { path = "../project" }
mikan-react-bridge = { path = "../react-bridge" }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
serde_json.workspace = true
unicode-segmentation = "1.13.3"
