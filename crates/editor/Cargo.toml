[package]
name = "mikan-editor"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# `gpui-kit` re-exports GPUI (as `gpui_kit::*`) from `gpui-pre` 0.3.x — a newer zed
# snapshot than the former `gpui 0.2.2` pin. `windows-manifest` is a default feature of
# `gpui-pre`, so the Common-Controls v6 app manifest (without which gpui's
# `TaskDialogIndirect` import fails to bind against comctl32 v5.82 and the editor exits at
# startup with STATUS_ENTRYPOINT_NOT_FOUND, 0xc0000139) stays embedded without re-listing.
gpui-kit = "0.6"
image = { version = "0.25.8", default-features = false }
mikan-composition = { path = "../composition" }
mikan-editor-core = { path = "../editor-core" }
mikan-editor-theme = { path = "../editor-theme" }
mikan-evaluator = { path = "../evaluator" }
mikan-exporter = { path = "../exporter" }
mikan-gpu-renderer = { path = "../gpu-renderer" }
mikan-media = { path = "../media" }
mikan-project = { path = "../project" }
mikan-react-bridge = { path = "../react-bridge" }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
serde_json.workspace = true
unicode-segmentation = "1.13.3"
