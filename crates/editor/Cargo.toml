[package]
name = "celesta-editor"
description = "The Celesta desktop app: preview, scrub, and edit code-first videos built with React."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# `bundled/` holds the repository files `build.rs` embeds when the crate is
# built outside the repository (scripts/bundle-crate-files.mjs).
include = ["/build.rs", "/bundled", "/src", "/tests"]

[dependencies]
# `gpui-kit` re-exports GPUI (as `gpui_kit::*`) from `gpui-pre` 0.3.x — a newer zed
# snapshot than the former `gpui 0.2.2` pin. `windows-manifest` is a default feature of
# `gpui-pre`, so the Common-Controls v6 app manifest (without which gpui's
# `TaskDialogIndirect` import fails to bind against comctl32 v5.82 and the editor exits at
# startup with STATUS_ENTRYPOINT_NOT_FOUND, 0xc0000139) stays embedded without re-listing.
gpui-kit = "0.9"
image = { version = "0.25.8", default-features = false }
celesta-composition.workspace = true
celesta-editor-core.workspace = true
celesta-editor-theme.workspace = true
celesta-evaluator.workspace = true
celesta-exporter.workspace = true
celesta-gpu-renderer = { workspace = true, features = ["clap"] }
celesta-plugin-host.workspace = true
celesta-media.workspace = true
celesta-remote.workspace = true
celesta-project.workspace = true
celesta-react-bridge.workspace = true
celesta-source-edit.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap.workspace = true
dunce = "1.0.5"
fnv = "1.0.7"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde_json.workspace = true
shlex = "2"
unicode-segmentation = "1.13.3"
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
# GPUI's test context, for the export page's tests in a headless window.
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
# The export page's tests list the lossless test codec's components.
celesta-codec-test.workspace = true
