[package]
name = "celesta-cli"
description = "The celesta command: manages a project's registry plugins."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "celesta"
path = "src/main.rs"

[dependencies]
celesta-plugin-host.workspace = true
celesta-registry-client.workspace = true
celesta-registry-format.workspace = true
clap.workspace = true
semver = "1.0.28"
serde_json = { workspace = true, features = ["raw_value"] }
tempfile = "3.23.0"
serde.workspace = true
thiserror.workspace = true
time = "0.3.55"

[dev-dependencies]
celesta-registry-client = { workspace = true, features = ["testing"] }
