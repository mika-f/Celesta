[package]
name = "celesta-plugin-host"
description = "Finds Celesta content plugins and runs each in a process of its own, answering the renderer for them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
celesta-plugin.workspace = true
celesta-registry-format.workspace = true
semver = { version = "1.0.28", features = ["serde"] }
serde.workspace = true
sha2 = "0.11"
strip-ansi-escapes = "0.2.1"
serde_json.workspace = true
thiserror.workspace = true
time = { version = "0.3.55", features = ["parsing"] }

[dev-dependencies]
tempfile = "3.23.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

