[package]
name = "celesta-media-image"
description = "Celesta's built-in image components: PNG, JPEG, WebP and animated GIF encoders and the image, image-sequence and GIF muxers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
celesta-composition.workspace = true
celesta-media.workspace = true
celesta-plugin-host.workspace = true
color_quant = "1.1.0"
gif = { version = "0.14.2", default-features = false, features = ["std"] }
image = { version = "0.25.8", default-features = false, features = ["jpeg"] }
png = "0.18.1"
webp = { version = "0.3.1", default-features = false }

[dev-dependencies]
tempfile = "3.23.0"
