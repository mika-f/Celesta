[package]
name = "celesta-registry-client"
description = "Fetches, verifies, and caches the plugin registry's signed files, and installs the plugin archives they list."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# A signed registry served from a temporary folder, for other crates' tests.
testing = ["dep:ed25519-dalek", "dep:base64"]

[dependencies]
base64 = { version = "0.22.1", optional = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std"], optional = true }
celesta-plugin-host.workspace = true
celesta-registry-format.workspace = true
celesta-remote.workspace = true
indexmap = { version = "2", features = ["serde"] }
semver = { version = "1.0.28", features = ["serde"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "0.11"
tempfile = "3.23.0"
thiserror.workspace = true
time = { version = "0.3.55", features = ["formatting", "parsing"] }
ureq = { version = "3.4.2", default-features = false }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
celesta-registry-client = { path = ".", features = ["testing"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
