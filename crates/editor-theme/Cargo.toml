[package]
name = "celesta-editor-theme"
description = "The Celesta editor's gpui-kit theme setup and the colors of the data its timeline draws."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
gpui-kit = "0.9"
celesta-project.workspace = true

[dev-dependencies]
# GPUI's test context, for running `init` in the theme's tests. gpui-kit's
# own `test-support` feature pulls a taffy that conflicts with gpui-pre's.
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
