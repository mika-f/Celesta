[package]
name = "celesta-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23"
celesta-composition = { path = "../composition" }
celesta-exporter = { path = "../exporter" }
celesta-react-bridge = { path = "../react-bridge" }
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp"] }
png = "0.18.1"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.0"
serde.workspace = true
serde_json.workspace = true
tempfile = "3.23.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "signal"] }
strum.workspace = true
anyhow.workspace = true

[dev-dependencies]
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process"] }
