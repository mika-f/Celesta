[package]
name = "celesta-gpu-renderer"
description = "Celesta's wgpu renderer: offscreen image, video, and text composition with deterministic readback."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck = "1.25.2"
image = { version = "0.25.8", default-features = false, features = ["gif", "jpeg", "png", "pnm", "webp"] }
celesta-composition.workspace = true
celesta-plugin.workspace = true
celesta-remote.workspace = true
celesta-media.workspace = true
celesta-renderer.workspace = true
naga = { version = "30.0.1", features = ["wgsl-in"] }
pollster = "1.0.0"
rayon = "1.12.0"
serde_json.workspace = true
# Keys the scene shader cache by the WGSL's digest.
sha2 = "0.10"
wgpu = { version = "30.0.1", features = ["naga-ir"] }
clap = { workspace = true, optional = true }
strum.workspace = true
thiserror.workspace = true
# naga's own identifier rule, which `wgsl.rs` reads declarations by.
unicode-ident = "1.0.27"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.0"
core-video = { version = "0.6.0", features = ["metal"] }
foreign-types = "0.5.0"
metal = "0.33.0"
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
objc2-metal = "0.3.2"
wgpu-hal = "30.0.1"

[dev-dependencies]
tempfile = "3.23.0"

[features]
# Lets the options a command line takes derive `clap::ValueEnum`.
clap = ["dep:clap"]
