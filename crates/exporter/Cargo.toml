[package]
name = "celesta-exporter"
description = "Frame-exact export of Celesta videos and stills, as a library and the celesta-exporter command."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
celesta-composition.workspace = true
celesta-evaluator.workspace = true
celesta-gpu-renderer = { workspace = true, features = ["clap"] }
celesta-plugin-host.workspace = true
celesta-media-image.workspace = true
celesta-media = { workspace = true, features = ["clap"] }
celesta-project.workspace = true
celesta-react-bridge.workspace = true
celesta-remote.workspace = true
tempfile = "3.23.0"
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
strum.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Tests read and write media with the lossless test codec.
celesta-codec-test.workspace = true
# A fake content plugin's answers, for the cancel test.
celesta-plugin.workspace = true
# Tests decode the stills they write.
png = "0.18.1"
webp = { version = "0.3.1", default-features = false }
image = { version = "0.25.8", default-features = false, features = ["jpeg"] }

[features]
# Builds the runtime test group: tests that need Node.js and the built React
# runtime (`pnpm run build:runtime`). See docs/handoff/2026-11-11-test-groups.md.
runtime-tests = []

[[test]]
name = "runtime"
required-features = ["runtime-tests"]
