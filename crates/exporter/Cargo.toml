[package]
name = "celesta-exporter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
png = "0.18.1"
celesta-composition = { path = "../composition" }
celesta-evaluator = { path = "../evaluator" }
ez-ffmpeg.workspace = true
celesta-gpu-renderer = { path = "../gpu-renderer" }
celesta-media = { path = "../media" }
celesta-project = { path = "../project" }
celesta-react-bridge = { path = "../react-bridge" }
tempfile = "3.23.0"

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
ez-ffmpeg = { workspace = true, features = ["static"] }
