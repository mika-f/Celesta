[package]
name = "celesta-react-bridge"
description = "Runs the @celesta/cli Node.js runtime and evaluates a React composition into a Celesta scene."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
celesta-composition.workspace = true
celesta-media.workspace = true
celesta-plugin-host.workspace = true
celesta-remote.workspace = true
celesta-renderer.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3.23.0"
thiserror.workspace = true

[dev-dependencies]
# Tests read media with the lossless test codec.
celesta-codec-test.workspace = true

[features]
# Builds the runtime test group: tests that need Node.js and the built React
# runtime (`pnpm run build:runtime`). See docs/handoff/2026-11-11-test-groups.md.
runtime-tests = []

[[test]]
name = "runtime"
required-features = ["runtime-tests"]
