[package]
name = "celesta-media"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
celesta-composition = { path = "../composition" }
ez-ffmpeg.workspace = true

# macOS packages bundle Homebrew dylibs; retain static linking elsewhere.
[target.'cfg(not(target_os = "macos"))'.dependencies]
ez-ffmpeg = { workspace = true, features = ["static"] }
