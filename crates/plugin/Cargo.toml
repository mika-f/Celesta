[package]
name = "celesta-plugin"
description = "What Celesta content plugins return (textured meshes or 3D scenes) and how they talk to Celesta. Depends on no Celesta crate, so plugins can use it without linking Celesta."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(any(unix, windows))'.dependencies]
# Keeps stdout for the protocol alone (see protocol::serve_requests).
libc = "0.2"

# Runs itself as a plugin process, which the default harness would garble by
# printing its own progress on stdout first.
[[test]]
name = "stdout"
harness = false
