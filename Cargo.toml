[workspace]
resolver = "3"
members = [
  "crates/composition",
  "crates/evaluator",
  "crates/project",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mika-f/mikan"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
