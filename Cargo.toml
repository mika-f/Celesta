[workspace]
resolver = "3"
members = [
  "crates/bench",
  "crates/budoux",
  "crates/composition",
  "crates/editor",
  "crates/editor-core",
  "crates/editor-theme",
  "crates/evaluator",
  "crates/exporter",
  "crates/gpu-renderer",
  "crates/mcp",
  "crates/media",
  "crates/plugin",
  "crates/plugin-host",
  "crates/project",
  "crates/react-bridge",
  "crates/remote",
  "crates/renderer",
  "crates/source-edit",
  "examples/plugins/flag",
  "examples/plugins/turntable",
]
# The VRM plugin is a workspace of its own, built and tested on its own.
exclude = ["plugins/vrm"]

[workspace.package]
# The released version; a release tag (vX.Y.Z) must match it.
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mika-f/celesta"
rust-version = "1.89"

[workspace.dependencies]
# The workspace's own crates, for crates.io: a published crate names its
# dependencies by version. The exact pins move with `workspace.package`'s
# version, and Cargo refuses to resolve them if a release bump misses one.
celesta-budoux = { path = "crates/budoux", version = "=0.9.0" }
celesta-composition = { path = "crates/composition", version = "=0.9.0" }
celesta-editor-core = { path = "crates/editor-core", version = "=0.9.0" }
celesta-editor-theme = { path = "crates/editor-theme", version = "=0.9.0" }
celesta-evaluator = { path = "crates/evaluator", version = "=0.9.0" }
celesta-exporter = { path = "crates/exporter", version = "=0.9.0" }
celesta-gpu-renderer = { path = "crates/gpu-renderer", version = "=0.9.0" }
celesta-media = { path = "crates/media", version = "=0.9.0" }
celesta-plugin = { path = "crates/plugin", version = "=0.9.0" }
celesta-plugin-host = { path = "crates/plugin-host", version = "=0.9.0" }
celesta-project = { path = "crates/project", version = "=0.9.0" }
celesta-react-bridge = { path = "crates/react-bridge", version = "=0.9.0" }
celesta-remote = { path = "crates/remote", version = "=0.9.0" }
celesta-renderer = { path = "crates/renderer", version = "=0.9.0" }
celesta-source-edit = { path = "crates/source-edit", version = "=0.9.0" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ez-ffmpeg = { version = "0.19" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signalsmith-stretch = "0.1.3"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
ts-rs = { version = "12.0", features = ["serde-json-impl"] }

[profile.dev.package.signalsmith-stretch]
# The bundled C++ is unusably slow at -O0.
opt-level = 3
