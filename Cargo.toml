[workspace]
resolver = "3"
members = [
  "crates/bench",
  "crates/budoux",
  "crates/composition",
  "crates/editor",
  "crates/editor-core",
  "crates/editor-theme",
  "crates/evaluator",
  "crates/exporter",
  "crates/gpu-renderer",
  "crates/mcp",
  "crates/media",
  "crates/project",
  "crates/react-bridge",
  "crates/remote",
  "crates/renderer",
  "crates/source-edit",
]

[workspace.package]
# The released version; a release tag (vX.Y.Z) must match it.
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mika-f/celesta"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ez-ffmpeg = { version = "0.19" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signalsmith-stretch = "0.1.3"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
ts-rs = { version = "12.0", features = ["serde-json-impl"] }

[profile.dev.package.signalsmith-stretch]
# The bundled C++ is unusably slow at -O0.
opt-level = 3
